<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slides to PDF</title>
  <style>
    /* ── Design tokens (from Figma: Slides to PDF) ── */
    :root {
      --bg-page:      #fafafa;
      --bg-surface:   #ffffff;
      --bg-header:    #2c2c2c;
      --bg-subtle:    #f5f5f5;

      --brand:        #0a78ff;
      --brand-border: #3392ff;
      --brand-hover:  #0069e6;
      --brand-active: #005bc7;

      --sel-card-bg:  #f0f7ff;
      --sel-card-br:  #a3ccff;
      --sel-row-bg:   #e5f1ff;

      --border:       #ebebeb;
      --divider:      #f5f5f5;

      --text:         #212121;
      --text-muted:   #878787;

      --danger:       #e5484d;
      --success:      #1a9e5f;

      --radius-sm:    4px;
      --radius-md:    6px;
      --radius-lg:    8px;

      --rail:         230px;
      --header-h:     40px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 12px;
      color: var(--text);
      background: var(--bg-page);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .icon { display: block; flex-shrink: 0; }

    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    button:disabled { cursor: not-allowed; }

    /* ── Header ── */
    .header {
      height: var(--header-h);
      flex-shrink: 0;
      background: var(--bg-header);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }
    .brand { display: flex; align-items: center; gap: 5px; }
    .brand-mark {
      width: 24px; height: 24px; border-radius: var(--radius-md);
      background: #fff; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      color: var(--bg-header); font-size: 11px; font-weight: 700;
    }
    .brand-name { font-size: 12px; font-weight: 500; color: #fff; }
    .header-close {
      width: 20px; height: 20px; color: #fff; opacity: .85;
      display: flex; align-items: center; justify-content: center;
      border-radius: var(--radius-sm);
    }
    .header-close:hover { opacity: 1; background: rgba(255,255,255,.12); }

    /* ── Screen plumbing ── */
    .screen { flex: 1; min-height: 0; display: none; }
    .screen.active { display: flex; }

    /* ══════════════════════════════════════════════
       Screen 1 — slide picker
       ══════════════════════════════════════════════ */
    #screen-picker { flex-direction: column; }

    .picker-scroll { flex: 1; min-height: 0; overflow-y: auto; }

    .picker-col {
      width: 692px;
      max-width: calc(100% - 48px);
      margin: 0 auto;
      padding: 32px 0 24px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .picker-hint {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .picker-hint-text { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .picker-hint-text span {
      font-size: 14px; letter-spacing: -0.14px; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .icon-btn {
      width: 24px; height: 24px; flex-shrink: 0;
      border: 1px solid var(--border); background: var(--bg-surface);
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      color: var(--text);
      transition: background .12s, border-color .12s;
    }
    .icon-btn:hover:not(:disabled) { background: var(--bg-subtle); border-color: #dcdcdc; }
    .icon-btn:disabled { opacity: .45; }
    .icon-btn.spinning svg { animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(-360deg); } }

    .picker-body { display: flex; flex-direction: column; gap: 12px; }

    /* Checkbox */
    .check-row { display: flex; align-items: center; gap: 8px; }
    .check-row label { cursor: pointer; font-size: 12px; }
    .checkbox {
      width: 16px; height: 16px; flex-shrink: 0;
      border-radius: var(--radius-sm);
      border: 1.5px solid #d4d4d4; background: var(--bg-surface);
      display: flex; align-items: center; justify-content: center;
      color: #fff; transition: background .12s, border-color .12s;
    }
    .checkbox.checked, .checkbox.indeterminate {
      background: var(--brand); border-color: var(--brand);
    }
    .checkbox svg { width: 11px; height: 11px; stroke-width: 3; display: none; }
    .checkbox.checked .tick, .checkbox.indeterminate .dash { display: block; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }

    .card { display: flex; flex-direction: column; gap: 8px; min-width: 0; text-align: left; }
    .card-thumb {
      position: relative;
      height: 232px;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      transition: background .12s, border-color .12s, box-shadow .12s;
    }
    .card:hover .card-thumb { border-color: #d8d8d8; }
    .card.selected .card-thumb {
      background: var(--sel-card-bg);
      border-color: var(--sel-card-br);
    }
    .card-thumb img { width: 100%; height: auto; max-height: 100%; object-fit: contain; display: block; }
    .card-thumb .placeholder {
      width: 100%; height: 60%;
      background: linear-gradient(100deg, #f2f2f2 30%, #e9e9e9 50%, #f2f2f2 70%);
      background-size: 220% 100%;
      animation: shimmer 1.1s linear infinite;
    }
    @keyframes shimmer { to { background-position: -220% 0; } }
    .card-thumb .failed { font-size: 11px; color: var(--text-muted); }

    .card-name {
      font-size: 12px; color: var(--text-muted);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .picker-empty {
      padding: 64px 0; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .picker-empty h3 { font-size: 13px; font-weight: 600; }
    .picker-empty p { font-size: 12px; color: var(--text-muted); max-width: 320px; line-height: 1.5; }

    /* Footer */
    .footer {
      flex-shrink: 0;
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
      padding: 16px 294px 16px 12px;
      display: flex; justify-content: flex-end; align-items: center; gap: 12px;
    }

    .btn-primary {
      background: var(--brand);
      border: 1px solid var(--brand-border);
      color: #fff;
      border-radius: var(--radius-md);
      padding: 10px 16px;
      font-size: 15px;
      letter-spacing: -0.225px;
      line-height: 1;
      display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      transition: background .12s;
    }
    .btn-primary:hover:not(:disabled) { background: var(--brand-hover); }
    .btn-primary:active:not(:disabled) { background: var(--brand-active); }
    .btn-primary:disabled { opacity: .45; }

    /* ══════════════════════════════════════════════
       Screen 2 — editor
       ══════════════════════════════════════════════ */
    #screen-editor { flex-direction: row; min-width: 0; }

    .rail {
      width: var(--rail);
      flex-shrink: 0;
      background: var(--bg-surface);
      display: flex; flex-direction: column;
      min-height: 0;
    }
    .rail-left  { border-right: 1px solid var(--border); }
    .rail-right { border-left: 1px solid var(--border); }

    .rail-head {
      height: var(--header-h); flex-shrink: 0;
      display: flex; align-items: center; gap: 6px;
      padding: 0 8px 0 16px;
      border-bottom: 1px solid var(--divider);
      font-size: 12px; font-weight: 500;
    }
    .rail-head .back {
      width: 24px; height: 24px; margin-left: -6px;
      display: flex; align-items: center; justify-content: center;
      border-radius: var(--radius-sm); color: var(--text-muted);
    }
    .rail-head .back:hover { background: var(--bg-subtle); color: var(--text); }
    .rail-head .count { margin-left: auto; color: var(--text-muted); font-weight: 400; }

    .frame-list { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 0; }

    .frame-row {
      display: flex; align-items: center; gap: 4px;
      padding: 0 8px; height: 32px;
      margin-bottom: 4px;
    }
    .frame-row:last-child { margin-bottom: 0; }
    .frame-row .grip {
      width: 16px; height: 16px; flex-shrink: 0;
      color: #c8c8c8; cursor: grab;
      display: flex; align-items: center; justify-content: center;
    }
    .frame-row .grip:active { cursor: grabbing; }
    .frame-row.dragging { opacity: .4; }
    .frame-row.drag-over .frame-pill { box-shadow: inset 0 2px 0 -1px var(--brand); }

    .frame-pill {
      flex: 1; min-width: 0;
      display: flex; align-items: center; gap: 5px;
      padding: 8px; border-radius: var(--radius-sm);
      color: var(--text);
      transition: background .12s;
    }
    .frame-pill:hover { background: var(--bg-subtle); }
    .frame-row.active .frame-pill { background: var(--sel-row-bg); }
    .frame-pill .lbl {
      font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* Centre preview pane */
    .stage {
      flex: 1; min-width: 0; min-height: 0;
      overflow-y: auto;
      padding: 16px 15px;
      display: flex; flex-direction: column; gap: 20px;
    }
    .stage-item { display: flex; flex-direction: column; gap: 8px; scroll-margin-top: 16px; }
    .stage-name {
      font-size: 12px; color: var(--text-muted);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .stage-canvas {
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--bg-surface);
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      min-height: 120px;
    }
    .stage-canvas img { width: 100%; height: auto; display: block; }
    .stage-canvas .placeholder {
      width: 100%; aspect-ratio: 16 / 9;
      background: linear-gradient(100deg, #f4f4f4 30%, #ececec 50%, #f4f4f4 70%);
      background-size: 220% 100%;
      animation: shimmer 1.1s linear infinite;
    }

    /* Right rail */
    .opt-row {
      height: 48px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--divider);
    }
    .opt-row .lbl { font-size: 12px; font-weight: 500; }
    .opt-row .sub { font-size: 11px; color: var(--text-muted); font-weight: 400; }

    .toggle { position: relative; width: 32px; height: 20px; flex-shrink: 0; }
    .toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
    .toggle-track {
      position: absolute; inset: 0;
      background: var(--bg-subtle);
      border-radius: 16.667px;
      cursor: pointer;
      transition: background .16s;
    }
    .toggle-track::before {
      content: '';
      position: absolute;
      width: 13.333px; height: 13.333px;
      left: 3.33px; top: 50%;
      margin-top: -6.667px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 1px 3px rgba(0,0,0,.22);
      transition: transform .16s;
    }
    .toggle input:checked + .toggle-track { background: var(--brand); }
    .toggle input:checked + .toggle-track::before { transform: translateX(12px); }
    .toggle input:disabled + .toggle-track { opacity: .5; cursor: not-allowed; }

    .rail-actions { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .rail-actions .btn-primary { width: 100%; }

    .progress { padding: 0 16px; }
    .progress-track { height: 3px; border-radius: 3px; background: var(--bg-subtle); overflow: hidden; }
    .progress-bar { height: 100%; width: 0; background: var(--brand); border-radius: 3px; transition: width .25s ease; }

    .status {
      padding: 0 16px 16px;
      font-size: 11px; color: var(--text-muted);
      line-height: 1.45; min-height: 16px;
      word-break: break-word;
    }
    .status.error   { color: var(--danger); }
    .status.success { color: var(--success); }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #dcdcdc; border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
    ::-webkit-scrollbar-thumb:hover { background: #c4c4c4; background-clip: content-box; }

    /* Narrow windows: Figma clamps the plugin to the available space, so the
       1280-wide design has to survive being squeezed. */
    @media (max-width: 900px) {
      :root { --rail: 190px; }
      .footer { padding-right: 24px; }
    }
    @media (max-width: 680px) {
      #screen-editor .rail-left { display: none; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="brand">
      <div class="brand-mark">P</div>
      <span class="brand-name">Slides to PDF</span>
    </div>
    <button class="header-close" id="close-btn" title="Close plugin" aria-label="Close plugin"></button>
  </header>

  <!-- ── Screen 1: pick slides ── -->
  <section class="screen active" id="screen-picker">
    <div class="picker-scroll">
      <div class="picker-col">

        <div class="picker-hint">
          <div class="picker-hint-text">
            <span id="hint-icon"></span>
            <span id="hint-text">Select frames from Figma layers to proceed</span>
          </div>
          <button class="icon-btn" id="refresh-btn" title="Refresh from selection" aria-label="Refresh from selection"></button>
        </div>

        <div class="picker-body" id="picker-body">
          <div class="check-row" id="select-all-row">
            <span class="checkbox" id="select-all-box" role="checkbox" tabindex="0" aria-checked="false"></span>
            <label for="select-all-box" id="select-all-label">Select all</label>
          </div>
          <div class="grid" id="card-grid"></div>
        </div>

        <div class="picker-empty" id="picker-empty">
          <h3>No frames selected</h3>
          <p>Select one or more frames in the Figma canvas — or click a section to pull in every slide inside it — then hit refresh.</p>
        </div>

      </div>
    </div>

    <div class="footer">
      <button class="btn-primary" id="continue-btn" disabled>Continue with Slides (0)</button>
    </div>
  </section>

  <!-- ── Screen 2: arrange and export ── -->
  <section class="screen" id="screen-editor">

    <aside class="rail rail-left">
      <div class="rail-head">
        <button class="back" id="back-btn" title="Back to slide picker" aria-label="Back to slide picker"></button>
        <span>Frames</span>
        <span class="count" id="editor-count"></span>
      </div>
      <div class="frame-list" id="frame-list"></div>
    </aside>

    <main class="stage" id="stage"></main>

    <aside class="rail rail-right">
      <div class="opt-row">
        <div>
          <div class="lbl">Merge</div>
          <div class="sub">One combined PDF</div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="merge" checked>
          <span class="toggle-track"></span>
        </label>
      </div>

      <div class="opt-row">
        <div>
          <div class="lbl">Compress</div>
          <div class="sub">Packs structure, not images</div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="compress">
          <span class="toggle-track"></span>
        </label>
      </div>

      <div class="rail-actions">
        <button class="btn-primary" id="export-btn">Export</button>
      </div>

      <div class="progress" id="progress" style="display:none">
        <div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div>
      </div>

      <div class="status" id="status"></div>
    </aside>

  </section>

<!-- INJECT_SCRIPT -->
</body>
</html>
